<script>
/* Two Plates public demo: a stand-in for Claude's database and AI that runs entirely in this browser.
   The real app runs inside Claude, where data syncs between everyone's phones and Claude reads photos and writes
   the coaching. Here every "AI" answer is worked out from a small built-in food list and the sample data. */
(() => {
  "use strict";
  const LANG = (() => { let l = null; try { const q = new URLSearchParams(location.search).get("lang"); if (q === "en" || q === "zh") { localStorage.setItem("tp.lang", q); l = q; } else l = localStorage.getItem("tp.lang"); } catch { l = null; } return l === "en" ? "en" : "zh"; })();
  window.TP_LANG = LANG;
  const ZHU = LANG === "zh";
  document.documentElement.lang = ZHU ? "zh-Hant-TW" : "en";
  const KEY = "tp.demo.db.v1", META = "tp.demo.meta.v1";
  const DAY = 864e5;
  const store = (() => { try { const k = "__tp_test"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return localStorage; } catch { return null; } })();
  const lsGet = (k) => { try { return store ? JSON.parse(store.getItem(k) || "null") : null; } catch { return null; } };
  const lsSet = (k, v) => { try { if (store) store.setItem(k, JSON.stringify(v)); } catch { /* full or blocked */ } };

  /* ---------- dates ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dayAgo = (n) => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n); return ymd(d); };
  const at = (n, h, m) => { const d = new Date(); d.setDate(d.getDate() - n); d.setHours(h, m, 0, 0); return d.getTime(); };
  const dowAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.getDay(); };
  const r1 = (x) => Math.round(x * 10) / 10;
  const fmtN = (n) => Math.round(n).toLocaleString("en-US");

  /* ---------- foods (per serving) ---------- */
  const F = {
    pancake: ["Egg pancake 蛋餅", "1 roll", 255, 9, 30, 11, "蛋餅", "1 份"],
    soy: ["Unsweetened soy milk 無糖豆漿", "1 bottle (400 ml)", 140, 12, 6, 7, "無糖豆漿", "1 瓶（400 ml）"],
    teaegg: ["Tea egg 茶葉蛋", "1 egg", 75, 7, 1, 5, "茶葉蛋", "1 顆"],
    yogurt: ["Greek yogurt", "1 cup (150 g)", 130, 15, 7, 4, "希臘優格", "1 杯（150 g）"],
    banana: ["Banana 香蕉", "1 medium", 105, 1, 27, 0, "香蕉", "1 根"],
    riceball: ["Rice ball 飯糰", "1 roll", 450, 13, 68, 14, "飯糰", "1 個"],
    sweetpotato: ["Roasted sweet potato 地瓜 (7-Eleven)", "1 medium", 160, 2, 37, 0, "烤地瓜（7-11）", "1 條"],
    latte: ["Latte 拿鐵", "1 large cup", 190, 10, 15, 9, "拿鐵", "1 大杯"],
    americano: ["Americano 美式咖啡", "1 large cup", 10, 0, 2, 0, "美式咖啡", "1 大杯"],
    sandwich: ["Ham & egg sandwich 火腿蛋三明治", "1 sandwich", 330, 14, 32, 16, "火腿蛋三明治", "1 份"],
    bento: ["Chicken leg bento 雞腿便當", "1 box", 820, 42, 95, 28, "雞腿便當", "1 個"],
    porkrice: ["Braised pork rice 滷肉飯 (small bowl)", "1 small bowl, about 250 g", 480, 14, 62, 19, "滷肉飯（小碗）", "1 小碗，約 250 g"],
    beefnoodle: ["Beef noodle soup 牛肉麵", "1 bowl", 650, 38, 75, 20, "牛肉麵", "1 碗"],
    dumplings: ["Boiled dumplings 水餃", "10 pieces", 520, 22, 60, 20, "水餃", "10 顆"],
    greens: ["Blanched greens 燙青菜", "1 plate", 90, 3, 8, 5, "燙青菜", "1 盤"],
    salad: ["Chicken breast salad", "1 bowl", 380, 35, 20, 17, "雞胸肉沙拉", "1 碗"],
    salmon: ["Salmon, rice and greens (home)", "1 plate", 640, 40, 62, 22, "鮭魚、白飯和青菜（自己煮）", "1 盤"],
    chicken: ["7-Eleven chicken breast 雞胸肉", "1 pack (100 g)", 120, 24, 2, 2, "7-11 雞胸肉", "1 包（100 g）"],
    hotpot: ["Hot pot 火鍋 (one person)", "1 set", 900, 50, 70, 45, "火鍋（單人）", "1 套"],
    friedrice: ["Fried rice 炒飯", "1 plate", 700, 20, 90, 26, "炒飯", "1 盤"],
    tofusoup: ["Tofu & egg soup + rice", "1 bowl + ½ bowl rice", 420, 24, 50, 12, "豆腐蛋花湯 + 白飯", "1 碗 + 半碗飯"],
    shake: ["Protein shake", "1 scoop + water", 120, 24, 3, 1, "高蛋白飲", "1 匙 + 水"],
    boba: ["Bubble milk tea 珍珠奶茶 (large, half sugar)", "1 cup (700 ml)", 480, 6, 80, 15, "珍珠奶茶（大杯半糖）", "1 杯（700 ml）"],
    bobasmall: ["Bubble milk tea 珍珠奶茶 (medium, 30% sugar)", "1 cup (500 ml)", 300, 4, 50, 10, "珍珠奶茶（中杯微糖）", "1 杯（500 ml）"],
    saltchicken: ["Salt & pepper chicken 鹽酥雞", "1 bag", 620, 30, 35, 40, "鹽酥雞", "1 袋"],
    guava: ["Guava 芭樂", "1 fruit", 110, 4, 23, 1, "芭樂", "1 顆"],
    gua: ["Gua bao 割包", "1 bun", 340, 12, 38, 15, "割包", "1 個"],
    oatmeal: ["Oatmeal with milk", "1 bowl", 260, 12, 38, 7, "牛奶燕麥", "1 碗"],
  };
  const entry = (k, t, src, qty = 1) => { const [name, portion, kcal, p, c, f] = F[k]; return { id: "d" + t.toString(36) + k.slice(0, 3), t, name, portion, qty, kcal, p, c, f, src }; };

  /* ---------- deterministic randomness ---------- */
  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /* ---------- the sample couple ---------- */
  function seed() {
    const db = {};
    const Y = new Date().getFullYear();
    const now = Date.now();
    db["people/p_jun"] = { id: "p_jun", name: "Jun", sex: "male", birthYear: Y - 27, height: 176, weight: 78.6, activity: "moderate", pace: "steady", color: "#1E7A62", targetMode: "auto", uid: "demo-visitor", createdAt: 1, sleepGoalH: 7.5, bedTarget: "23:30", sleepVia: "health" };
    db["people/p_mei"] = { id: "p_mei", name: "Mei", sex: "female", birthYear: Y - 25, height: 160, weight: 57.2, activity: "light", pace: "gentle", color: "#B4467A", targetMode: "auto", uid: "demo-partner", createdAt: 2, sleepGoalH: 8, bedTarget: "23:00", sleepVia: "phone" };
    // InBody check-ins: [days ago, weight, skeletal muscle, body fat mass, visceral, BMR, score]
    const CI = {
      p_jun: [[45, 81.2, 34.1, 19.2, 8, 1710, 73], [35, 80.3, 34.3, 18.1, 8, 1716, 75], [24, 79.6, 34.5, 17.2, 7, 1721, 77], [14, 79.4, 34.3, 17.1, 7, 1719, 77], [3, 78.6, 34.7, 16.1, 7, 1726, 79]],
      p_mei: [[41, 58.6, 21.0, 18.4, 5, 1238, 70], [27, 58.1, 21.1, 17.8, 5, 1242, 71], [13, 57.7, 21.2, 17.3, 4, 1244, 73], [4, 57.2, 21.4, 16.6, 4, 1249, 75]],
    };
    for (const [pid, rows] of Object.entries(CI)) rows.forEach(([n, w, smm, bfm, vis, bmr, score], i) => {
      const id = `ci_${pid.slice(2)}_${i + 1}`;
      db["checkins/" + id] = { id, pid, date: dayAgo(n), t: at(n, 9, 0), weight: w, smm, bfm, pbf: r1(bfm / w * 100), visceral: vis, bmr, ffm: r1(w - bfm), score };
    });
    // Food: Jun's stall (24→14 days ago) has big weekends and late-night snacks; the 11 days after are tidier.
    const R = rng(20261123);
    const pick = (arr) => arr[Math.floor(R() * arr.length)];
    const day = (pid, n, list) => {
      const es = list.filter(([, h, m]) => at(n, h, m) <= now).map(([k, h, m, src, q]) => entry(k, at(n, h, m) + Math.floor(R() * 4) * 60e3, src || "photo", q || 1));
      if (es.length) db[`days/${pid}_${dayAgo(n)}`] = { pid, date: dayAgo(n), entries: es };
    };
    for (let n = 50; n >= 0; n--) {
      const dow = dowAgo(n), wkend = dow === 0 || dow === 5 || dow === 6;
      const stall = n >= 15 && n <= 24;
      if (n === 31 || n === 19) { /* forgot to log */ } else {
        const bf = pick([[["pancake", 8, 5, "text"], ["soy", 8, 6, "fav"]], [["riceball", 8, 10, "photo"], ["soy", 8, 11, "barcode"]], [["sandwich", 7, 55, "photo"], ["americano", 7, 56, "quick"], ["teaegg", 8, 0, "text", 2]]]);
        const lunch = pick([[["bento", 12, 20, "photo"]], [["beefnoodle", 12, 30, "photo"], ["greens", 12, 31, "photo"]], [["porkrice", 12, 15, "text"], ["teaegg", 12, 16, "text"], ["greens", 12, 17, "text"]], [["dumplings", 12, 40, "photo"]]]);
        const snack = [["shake", 15, 40, "fav"]];
        const dinner = wkend && stall ? pick([[["hotpot", 19, 10, "photo"]], [["friedrice", 19, 30, "photo"], ["gua", 19, 31, "photo"]]]) : pick([[["salmon", 19, 0, "photo"]], [["salad", 18, 45, "photo"], ["sweetpotato", 18, 46, "barcode"]], [["tofusoup", 19, 15, "text"], ["chicken", 19, 16, "fav"]]]);
        const late = wkend && stall ? [["boba", 21, 50, "text"], ["saltchicken", 22, 40, "photo"]] : wkend && dow === 6 ? [["bobasmall", 16, 30, "text"]] : (stall && R() < 0.35 ? [["boba", 21, 30, "text"]] : []);
        day("p_jun", n, [...bf, ...lunch, ...snack, ...dinner, ...late]);
      }
      if (n !== 27) {
        const bf = pick([[["yogurt", 8, 0, "fav"], ["banana", 8, 1, "fav"]], [["oatmeal", 7, 50, "text"]], [["teaegg", 8, 10, "text"], ["sweetpotato", 8, 11, "barcode"], ["soy", 8, 12, "fav"]]]);
        const lunch = pick([[["salad", 12, 30, "photo"]], [["beefnoodle", 12, 20, "photo"]], [["porkrice", 12, 10, "text"], ["greens", 12, 11, "text"]]]);
        const snack = R() < 0.5 ? [["guava", 15, 30, "quick"]] : [["latte", 15, 0, "text"]];
        const dinner = pick([[["tofusoup", 18, 50, "text"]], [["salmon", 19, 0, "photo"]], [["chicken", 19, 0, "fav"], ["sweetpotato", 19, 1, "barcode"], ["greens", 19, 2, "text"]]]);
        const treat = wkend && R() < 0.5 ? [["bobasmall", 16, 0, "text"]] : [];
        day("p_mei", n, [...bf, ...lunch, ...snack, ...dinner, ...treat]);
      }
      // Sleep (the night that ended on day n). Jun's band syncs through Apple Health; Mei's comes from phone use.
      const wake = (h, m) => at(n, h, m);
      const jl = wkend && stall;
      const jb = jl ? at(n, 0, 30 + Math.floor(R() * 40)) : at(n + 1, 23, 5 + Math.floor(R() * 45));
      const jw = jl ? wake(8, 40 + Math.floor(R() * 20)) : wake(7, 5 + Math.floor(R() * 20));
      if (jw <= now) db[`sleep/p_jun_${dayAgo(n)}`] = { pid: "p_jun", date: dayAgo(n), bed: jb, wake: jw, src: "health", t: jw };
      const mb = at(n + 1, 22, 50 + Math.floor(R() * 30)), mw = wake(7, Math.floor(R() * 15));
      if (mw <= now) db[`sleep/p_mei_${dayAgo(n)}`] = { pid: "p_mei", date: dayAgo(n), bed: mb, wake: mw, src: "phone", t: mw };
    }
    ["chicken", "soy", "shake", "yogurt", "banana", "bento"].forEach((k, i) => { const [name, portion, kcal, p, c, f] = F[k]; const id = "f" + (i + 1); db["favs/" + id] = { id, name, portion, kcal, p, c, f, by: "p_jun", t: now - (i + 1) * DAY }; });
    db["products/4710000000017"] = { code: "4710000000017", name: "Unsweetened soy milk (sample product)", serving: "1 bottle (400 ml)", kcal: 140, p: 12, c: 6, f: 7, by: "p_jun", t: now - 20 * DAY };
    db["products/4710000000024"] = { code: "4710000000024", name: "Roasted sweet potato (sample product)", serving: "1 medium (200 g)", kcal: 160, p: 2, c: 37, f: 0, by: "p_mei", t: now - 12 * DAY };
    // Claude's saved analyses (in the real app these come from Claude; here they're written from the numbers above).
    const avg = (pid, from, to) => {
      let k = 0, p = 0, n = 0;
      for (let d = from; d > to; d--) { const doc = db[`days/${pid}_${dayAgo(d)}`]; if (!doc) continue; n++; for (const e of doc.entries) { k += e.kcal * e.qty; p += e.p * e.qty; } }
      return { k: n ? k / n : 0, p: n ? p / n : 0, n };
    };
    const a1 = avg("p_jun", 14, 3), a0 = avg("p_jun", 24, 14);
    db["advice/p_jun"] = {
      pid: "p_jun", date: dayAgo(3), t: at(3, 9, 30), checkinId: "ci_jun_5", verdict: "better",
      headline: "Fat down 1.0 kg, muscle up 0.4 kg",
      assessment: `Over these 11 days you averaged about ${fmtN(a1.k)} kcal and ${fmtN(a1.p)} g protein a day, close to your targets. In the 10 days before, you averaged ${fmtN(a0.k)} kcal, mostly from weekend nights, and body fat barely moved. The difference this time was quieter weekends and earlier bedtimes.`,
      causes: [{ title: "One weekend treat left", evidence: "A medium bubble tea on Saturday afternoon, about 300 kcal. That's fine; it no longer comes with a late-night snack.", impact: "low" }],
      worked: [`Protein averaged ${fmtN(a1.p)} g a day`, "No food logged after 9 pm on weekends", "In bed before midnight most nights"],
      tips: ["Keep weekend dinners like weekday ones and plan one treat ahead", "Add a protein snack on rest days, like a tea egg or soy milk", "Test at the same time of day for the next InBody"],
      kcal: 2270, protein: 140, carbs: 270, fat: 70,
      watch: "Muscle: if it keeps rising while fat drops, keep calories the same.",
    };
    db["advice/p_mei"] = {
      pid: "p_mei", date: dayAgo(4), t: at(4, 10, 0),
      headline: "Slow, steady fat loss: keep going",
      assessment: "Body fat dropped 0.7 kg in 9 days while muscle went up 0.2 kg. Calories have been on target most days; protein is the one thing a little low.",
      kcal: 1550, protein: 90, carbs: 195, fat: 45,
      tips: ["Add a protein food at breakfast, like Greek yogurt or soy milk", "Keep the small bubble tea to once a week", "Keep the 23:00 bedtime"],
      watch: "Skeletal muscle: it should hold or rise as protein goes up.",
    };
    return db;
  }

  /* ---------- database (same shape as Claude's artifact db) ---------- */
  let meta = lsGet(META);
  let data = lsGet(KEY);
  const stale = !meta || !meta.seeded || Date.now() - meta.seeded > 3 * DAY;
  if (!data || stale) {
    data = seed();
    meta = { seeded: Date.now() };
    lsSet(META, meta); lsSet(KEY, data);
    try { if (store) { store.setItem("tp.me", JSON.stringify("p_jun")); store.setItem("tp.view", JSON.stringify("p_jun")); for (const k of Object.keys(store)) if (k.startsWith("tp.chat.") || k === "tp.lastHash") store.removeItem(k); } } catch { /* ignore */ }
  }
  const listeners = new Set();
  let saveT = 0;
  const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => lsSet(KEY, data), 50); };
  const emit = () => setTimeout(() => listeners.forEach((l) => l()), 0);
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const snap = (path) => ({ id: path.split("/").pop(), exists: path in data, data: () => clone(data[path]), metadata: { fromCache: false, hasPendingWrites: false } });
  const cmp = (a, op, b) => ({ "==": a === b, "!=": a !== b, ">=": a >= b, "<=": a <= b, ">": a > b, "<": a < b, in: Array.isArray(b) && b.includes(a) }[op]);
  function query(col, filters) {
    const run = () => {
      const pre = col + "/";
      const docs = Object.keys(data).filter((k) => k.startsWith(pre) && !k.slice(pre.length).includes("/")).sort().map(snap).filter((d) => filters.every(([f, op, v]) => cmp((d.data() || {})[f], op, v)));
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return {
      where: (f, op, v) => query(col, [...filters, [f, op, v]]),
      orderBy() { return this; }, limit() { return this; },
      get: async () => run(),
      onSnapshot(next) { const l = () => next(run()); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); },
      doc: (id) => doc(col + "/" + id),
    };
  }
  function doc(path) {
    return {
      id: path.split("/").pop(), path,
      get: async () => snap(path),
      set: async (v) => { data[path] = clone(v); persist(); emit(); },
      update: async (v) => { if (!(path in data)) throw { code: "invalid_argument", message: "missing" }; data[path] = { ...data[path], ...clone(v) }; persist(); emit(); },
      delete: async () => { delete data[path]; persist(); emit(); },
      onSnapshot(next) { const l = () => next(snap(path)); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); },
      collection: (p) => query(path + "/" + p, []),
    };
  }
  const db = { doc, collection: (p) => query(p, []) };
  window.__demoReset = () => {
    try { if (store) for (const k of Object.keys(store)) if (k.startsWith("tp.") && k !== "tp.demo.welcomed" && k !== "tp.lang") store.removeItem(k); } catch { /* ignore */ }
    location.reload();
  };

  /* ---------- food words → items (used by "Describe it", photo notes and the coach) ---------- */
  const LIB = [
    [/bubble ?(milk )?tea|boba|pearl milk tea|milk tea|珍珠奶茶|珍奶|波霸|奶茶/, "boba"],
    [/salt (and|&) pepper chicken|popcorn chicken|鹽酥雞/, "saltchicken"],
    [/chicken (leg |thigh )?bento|雞腿便當|bento|便當/, "bento"],
    [/braised pork rice|lu rou fan|滷肉飯/, "porkrice"],
    [/beef noodle|牛肉麵/, "beefnoodle"],
    [/egg pancake|dan ?bing|蛋餅/, "pancake"],
    [/tea eggs?|茶葉蛋/, "teaegg"],
    [/(7-?eleven |7-11 )?chicken breast|雞胸/, "chicken"],
    [/soy ?milk|豆漿/, "soy"],
    [/rice ball|onigiri|飯糰/, "riceball"],
    [/dumplings?|水餃|餃子/, "dumplings"],
    [/fried rice|炒飯/, "friedrice"],
    [/stinky tofu|臭豆腐/, ["Stinky tofu 臭豆腐", "1 plate", 420, 18, 25, 28, "臭豆腐", "1 盤"]],
    [/oyster omelet(te)?|蚵仔煎/, ["Oyster omelette 蚵仔煎", "1 plate", 450, 15, 40, 25, "蚵仔煎", "1 盤"]],
    [/scallion pancake|蔥抓餅|蔥油餅/, ["Scallion pancake 蔥抓餅", "1 pancake", 400, 7, 45, 21, "蔥抓餅", "1 片"]],
    [/gua ?bao|割包/, "gua"],
    [/hot ?pot|火鍋/, "hotpot"],
    [/sweet potato|地瓜/, "sweetpotato"],
    [/greek yog(h)?urt|yog(h)?urt|優格/, "yogurt"],
    [/protein shake|whey|乳清|protein powder/, "shake"],
    [/latte|拿鐵/, "latte"],
    [/americano|black coffee|美式/, "americano"],
    [/coffee|咖啡/, "americano"],
    [/salmon|鮭魚/, ["Grilled salmon 烤鮭魚", "1 fillet (150 g)", 310, 31, 0, 20, "烤鮭魚", "1 片（150 g）"]],
    [/sandwich|三明治/, "sandwich"],
    [/salad|沙拉/, "salad"],
    [/oat(meal|s)|燕麥/, "oatmeal"],
    [/instant noodles?|ramen|泡麵/, ["Instant noodles 泡麵", "1 pack", 450, 9, 60, 19, "泡麵", "1 包"]],
    [/noodles?|麵/, ["Noodles with meat sauce 炸醬麵", "1 bowl", 550, 18, 80, 16, "炸醬麵", "1 碗"]],
    [/greens|vegetables?|veggies|青菜/, "greens"],
    [/guava|芭樂/, "guava"],
    [/banana|香蕉/, "banana"],

<body>
<style>
/* Layout: one-column phone app. Sticky person switcher on top, grouped sections on a cool paper ground, fixed tab bar with a raised Add button. */
:root{
  --bg:#F1F4F0;
  --surface:#FFFFFF;
  --surface-2:#E9EEE9;
  --ink:#14201A;
  --ink-2:#46534B;
  --muted:#6F7B74;
  --line:#DCE3DD;
  --accent:#1E7A62;
  --accent-ink:#FFFFFF;
  --accent-soft:#D8EEE5;
  --protein:#eb6834;
  --carbs:#2a78d6;
  --fat:#1baf7a;
  --track:#E3E9E4;
  --good:#1D7A43;
  --good-soft:#DCF1E3;
  --warn:#A35F00;
  --warn-soft:#FBEBCF;
  --bad:#C23A3A;
  --bad-soft:#F8DEDC;
  --scrim:rgba(10,18,14,.42);
  --sleep:#6250d6;
  --sleep-soft:#E9E6FB;
  --night:#222A47;
  --night-ink:#EEF0FA;
  --shadow:0 1px 0 rgba(20,32,26,.04), 0 10px 28px -14px rgba(20,32,26,.28);
  --font-display:"Bricolage Grotesque", ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --surface:#17201B; --surface-2:#212B25; --ink:#E8EFEA; --ink-2:#B6C2BA; --muted:#8B978F; --line:#2A3530;
    --accent:#3FB08E; --accent-ink:#04130D; --accent-soft:#163A2E;
    --protein:#d95926; --carbs:#3987e5; --fat:#199e70; --track:#25302A;
    --good:#5BC488; --good-soft:#163323; --warn:#E3A33B; --warn-soft:#3A2B10; --bad:#EF6E6E; --bad-soft:#3C1C1C;
    --scrim:rgba(0,0,0,.6);
    --sleep:#9085e9; --sleep-soft:#27234A; --night:#272F55; --night-ink:#EEF0FA;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#17201B; --surface-2:#212B25; --ink:#E8EFEA; --ink-2:#B6C2BA; --muted:#8B978F; --line:#2A3530;
  --accent:#3FB08E; --accent-ink:#04130D; --accent-soft:#163A2E;
  --protein:#d95926; --carbs:#3987e5; --fat:#199e70; --track:#25302A;
  --good:#5BC488; --good-soft:#163323; --warn:#E3A33B; --warn-soft:#3A2B10; --bad:#EF6E6E; --bad-soft:#3C1C1C;
  --scrim:rgba(0,0,0,.6);
  --sleep:#9085e9; --sleep-soft:#27234A; --night:#272F55; --night-ink:#EEF0FA;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.svg-i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.svg-i.sm{width:18px;height:18px}

#app{max-width:560px;margin:0 auto}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;
  background:var(--bg);
  display:flex;align-items:center;gap:10px;
  padding-block:12px 10px;
}
.brand{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px;white-space:nowrap}
.brand-mark{width:22px;height:22px;flex:none}
.who{margin-left:auto;display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:999px;min-width:0;overflow-x:auto;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink-2)}
.who button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none;font-family:var(--font-display)}
.av.lg{width:44px;height:44px;font-size:19px}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md);background:var(--warn-soft);color:var(--ink);font-size:14px;margin-bottom:12px}
.banner .svg-i{color:var(--warn)}
.banner.info{background:var(--accent-soft)}
.banner.info .svg-i{color:var(--accent)}

/* ---------- views ---------- */
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.section-title h2{font-size:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .nav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.datebar .nav:not(:disabled):active{background:var(--surface-2)}
.datebtn{font-family:var(--font-display);font-weight:700;font-size:17px;padding:8px 12px;border-radius:999px}
.datebtn small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);text-align:center}

/* fuel summary */
.fuel{display:flex;flex-direction:column;gap:14px}
.fuel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bignum{font-family:var(--font-display);font-weight:800;font-size:52px;line-height:.95;letter-spacing:-.035em}
.bignum .unit{font-size:17px;font-weight:600;letter-spacing:0;margin-left:5px;color:var(--ink-2)}
.bignum.over{color:var(--bad)}
.fuel-side{text-align:right;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.fuel-side b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.over-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:2px 8px 2px 6px;border-radius:999px}
.meter{height:12px;border-radius:999px;background:var(--track);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent)}
.meter.kcal{height:14px}
.meter.over i{background:var(--bad)}
.macros{display:grid;gap:10px}
.macro{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px}
.macro .k{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;min-width:72px}
.macro .k i{width:10px;height:10px;border-radius:3px;flex:none}
.macro .v{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.macro .v b{color:var(--ink)}
.macro .meter{height:8px}
.macro.protein .meter i,.macro.protein .k i{background:var(--protein)}
.macro.carbs .meter i,.macro.carbs .k i{background:var(--carbs)}
.macro.fat .meter i,.macro.fat .k i{background:var(--fat)}
.macro .hint{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-2px}

/* partner strip */
.partner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow)}
.partner .p-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.partner .p-line{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.partner .p-line b{font-variant-numeric:tabular-nums}
.partner .meter{height:6px}
.partner .chev{color:var(--muted)}

/* ideas */
.ideas{display:flex;flex-direction:column;gap:10px}
.ideas-head{display:flex;align-items:center;gap:10px}
.ideas-head .txt{flex:1;min-width:0;font-size:14px;color:var(--ink-2)}
.ideas-head .txt b{color:var(--ink)}
.idea{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.idea .i-main{flex:1;min-width:0}
.idea .i-title{font-weight:600}
.idea .i-sub{font-size:13px;color:var(--muted)}

/* meals */
.meal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.meal-head{display:flex;align-items:center;gap:10px;padding:12px 10px 8px 16px}
.meal-head h3{font-size:17px;flex:1}
.meal-kcal{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.add-mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.entries{list-style:none;margin:0;padding:0 0 6px}
.entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 16px}
.entry:active{background:var(--surface-2)}
.thumb{width:44px;height:44px;border-radius:12px;flex:none;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.e-main{flex:1;min-width:0;display:flex;flex-direction:column}
.e-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-kcal{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.e-kcal small{font-weight:500;color:var(--muted);font-size:12px;margin-left:2px}
.meal-empty{display:block;width:calc(100% - 32px);margin:0 16px 14px;padding:12px;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--muted);font-weight:600;text-align:center}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn-row{display:flex;gap:10px}
.btn-row > *{flex:1}
.link{color:var(--accent);font-weight:600}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field small{font-size:12px;color:var(--muted)}
.input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--accent)}
textarea.input{min-height:90px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;background:var(--surface-2);text-align:left}
.opt[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.opt b{font-size:15px}
.opt small{font-size:12.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-size:22px;font-weight:600;display:grid;place-items:center}
.stepper output{min-width:64px;text-align:center;font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px);
}
.tabbar-in{max-width:560px;margin:0 auto;height:var(--tabbar-h);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding-block:6px}
.tab[aria-current="page"]{color:var(--accent)}
.tab-add{justify-self:center;width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px -8px color-mix(in srgb, var(--accent) 70%, transparent);transform:translateY(-10px)}
.tab-add .svg-i{width:28px;height:28px;stroke-width:2.2}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .18s ease}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-height:calc(100% - 28px - env(safe-area-inset-top, 0px));
  display:flex;flex-direction:column;
  background:var(--bg);border-radius:24px 24px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.18);
  animation:rise .24s cubic-bezier(.2,.8,.2,1);
}
.sheet-in{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-top{display:flex;align-items:center;gap:8px;padding:14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px))}
.sheet-top h2{flex:1;font-size:21px;min-width:0}
.sheet-x,.sheet-back{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.sheet-body > *{flex-shrink:0}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{animation:none}.spin{animation-duration:3s}}

.big-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-opt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);text-align:left;min-height:104px}
.big-opt .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.big-opt b{font-size:15px;line-height:1.2}
.big-opt small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.big-opt.primary{background:var(--accent);color:var(--accent-ink)}
.big-opt.primary .ic{background:color-mix(in srgb, var(--accent-ink) 18%, transparent);color:var(--accent-ink)}
.big-opt.primary small{color:color-mix(in srgb, var(--accent-ink) 78%, transparent)}

.list{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .r-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .r-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-end{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}

.photo-prev{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-md);display:block;background:var(--surface-2)}
.thinking{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow)}
.thinking .t-main{flex:1}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.err{padding:12px 14px;border-radius:var(--r-md);background:var(--bad-soft);color:var(--ink);font-size:14px}

.item-card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.item-card.off{opacity:.5}
.item-top{display:flex;align-items:center;gap:10px}
.item-top .input{min-height:40px;padding:6px 10px;font-weight:600}
.item-top input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.item-port{font-size:13px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;min-width:0}
.nums .input{min-height:40px;padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.conf{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:6px;flex:none}
.conf.low{background:var(--warn-soft);color:var(--warn)}
.conf.medium{background:var(--surface-2);color:var(--ink-2)}
.conf.high{background:var(--good-soft);color:var(--good)}
.totals-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--ink);color:var(--bg)}
.totals-bar b{font-family:var(--font-display);font-size:22px}
.totals-bar span{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}

/* ---------- progress ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.coach{display:flex;flex-direction:column;gap:12px}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px 4px 8px;border-radius:999px;align-self:flex-start}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.neutral{background:var(--surface-2);color:var(--ink-2)}
.coach h3{font-size:19px}
.coach p{color:var(--ink-2);font-size:14.5px}
.deltas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.delta{padding:10px 12px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.delta .d-k{font-size:12px;font-weight:600;color:var(--muted)}
.delta .d-v{font-family:var(--font-display);font-weight:700;font-size:19px;display:flex;align-items:center;gap:4px}
.delta .d-v .svg-i{width:16px;height:16px;stroke-width:2.4}
.delta.good .d-v .svg-i{color:var(--good)}
.delta.bad .d-v .svg-i{color:var(--bad)}
.delta .d-s{font-size:12px;color:var(--muted)}
.rec{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.rec .r-main{flex:1;min-width:0;font-size:14px}
.rec b{font-variant-numeric:tabular-nums}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:14.5px}
.ai-out{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.ai-out h4{margin:0;font-family:var(--font-display);font-size:16px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);text-align:left}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink), var(--shadow)}
.tile .t-k{font-size:12.5px;font-weight:600;color:var(--muted)}
.tile .t-v{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.02em}
.tile .t-v small{font-size:13px;font-weight:600;color:var(--ink-2);margin-left:2px;letter-spacing:0}
.tile .t-d{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:3px;color:var(--ink-2)}
.tile .t-d .svg-i{width:14px;height:14px;stroke-width:2.6}
.tile .t-d.good .svg-i{color:var(--good)}
.tile .t-d.bad .svg-i{color:var(--bad)}

.chart{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .lbl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .band{fill:var(--good-soft)}
.chart .band-lbl{fill:var(--good);font-size:10.5px;font-weight:700}
.chart .ref{stroke:var(--ink-2);stroke-width:1}
.chart .xh{stroke:var(--ink-2);stroke-width:1}
.chart .ring{stroke:var(--surface);stroke-width:2}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.3;white-space:nowrap;transform:translateX(-50%);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip b{display:block;font-size:15px;font-family:var(--font-display)}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.chart-head h3{font-size:17px}
.chart-head span{font-size:13px;color:var(--muted)}
details.table{font-size:13.5px}
details.table summary{color:var(--accent);font-weight:600;cursor:pointer;padding:8px 0 0}
.tbl-wrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
.avg-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.avg{display:flex;flex-direction:column;gap:1px}
.avg .a-k{font-size:12px;color:var(--muted);font-weight:600}
.avg .a-v{font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- profile ---------- */
.prof-head{display:flex;align-items:center;gap:14px}
.prof-head .ph-main{flex:1;min-width:0}
.prof-head h2{font-size:22px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14.5px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.target-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tg{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--surface-2)}
.tg .k{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.tg .k i{width:8px;height:8px;border-radius:2px}
.tg .v{font-family:var(--font-display);font-weight:700;font-size:20px}
.tg .v small{font-size:12px;color:var(--ink-2);font-weight:600}
.math{font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.math b{color:var(--ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2);font-size:14.5px}
.steps b{color:var(--ink)}
.color-pick{display:flex;gap:10px;flex-wrap:wrap}
.color-pick button{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--bg)}
.color-pick button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 16px;color:var(--ink-2)}
.empty h3{font-size:19px;color:var(--ink)}
.hero{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.hero h1{font-size:34px;line-height:1.02;letter-spacing:-.03em}
.hero p{color:var(--ink-2);font-size:15.5px;max-width:42ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:360px){
  .bignum{font-size:44px}
  .nums{grid-template-columns:repeat(2,1fr)}
  .target-grid{grid-template-columns:repeat(2,1fr)}
}

/* ---------- sleep ---------- */
.sleep-card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow)}
.sl-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sleep-soft);color:var(--sleep);flex:none}
.sl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}

  const X = (d) => pl + ((parseYmd(d).getTime() - base) / span) * iw;
  const Y = (v) => pt + ih - ((v - y0) / (y1 - y0)) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.unit)} trend chart">`;
  for (const tv of ticks) s += `<line class="grid" x1="${pl}" x2="${W - pr + 8}" y1="${Y(tv)}" y2="${Y(tv)}"/><text class="ax" x="${pl - 6}" y="${Y(tv) + 4}" text-anchor="end">${tv}</text>`;
  if (opt.band) s += `<rect class="band" x="${pl}" width="${iw}" y="${Y(opt.band[1])}" height="${Y(opt.band[0]) - Y(opt.band[1])}" opacity=".7"/><text class="band-lbl" x="${pl + 6}" y="${Y(opt.band[1]) + 13}">Normal ${opt.band[0]}–${opt.band[1]}%</text>`;
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  if (pts.length > 1 && !opt.band) {
    s += `<path d="${path}L${X(pts[pts.length - 1].d).toFixed(1)},${pt + ih}L${X(pts[0].d).toFixed(1)},${pt + ih}Z" fill="${opt.color}" opacity=".06"/>`;
  }
  if (pts.length > 1) {
    s += `<path d="${path}" fill="none" stroke="${opt.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  for (const p of pts) s += `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${p === pts[pts.length - 1] ? 4.5 : 2.5}" fill="${opt.color}" class="ring"/>`;
  const L = pts[pts.length - 1];
  s += `<text class="lbl" x="${X(L.d) + 8}" y="${Y(L.v) + 4}">${fmt1(L.v)}</text>`;
  s += `<text class="ax" x="${pl}" y="${H - 6}">${shortDate(pts[0].d)}</text>`;
  if (pts.length > 1) s += `<text class="ax" x="${W - pr}" y="${H - 6}" text-anchor="end">${shortDate(L.d)}</text>`;
  s += `<line class="xh" x1="0" x2="0" y1="${pt}" y2="${pt + ih}" visibility="hidden"/><rect x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent" class="hit"/></svg>`;
  CHARTS[id] = { type: "line", pts: pts.map((p) => ({ x: X(p.d), d: p.d, v: p.v })), W, unit: opt.unit };
  return `<div class="chart" id="${id}">${s}<div class="tip" hidden></div></div>`;
}
function barChart(id, pts, target, opt) {
  const W = chartWidth(), H = 170, pl = 38, pr = 8, pt = 18, pb = 24;
  const iw = W - pl - pr, ih = H - pt - pb;
  const maxV = Math.max(target * 1.2, ...pts.map((p) => p.v), 10);
  const ticks = niceTicks(0, maxV, 3);
  const y1 = ticks[ticks.length - 1];
  const Y = (v) => pt + ih - (v / y1) * ih;
  const band = iw / pts.length, bw = Math.min(18, band * 0.62);
  const short = (v) => (v >= 1000 ? r1(v / 1000) + "K" : String(v));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily ${esc(opt.unit)} for 14 days">`;
  for (const tv of ticks) s += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(tv)}" y2="${Y(tv)}"/><text class="ax" x="${pl - 6}" y="${Y(tv) + 4}" text-anchor="end">${short(tv)}</text>`;
  const meta = [];
  pts.forEach((p, i) => {
    const cx = pl + band * i + band / 2;
    meta.push({ x: cx, d: p.d, v: p.v, n: p.n });
    if (p.v <= 0) return;
    const y = Y(p.v), x = cx - bw / 2, y0 = pt + ih, r = Math.min(4, (y0 - y) / 2, bw / 2);
    s += `<path d="M${x},${y0}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${y0}Z" fill="${opt.color}"/>`;
  });
  const ty = Y(target);
  s += `<line class="ref" x1="${pl}" x2="${W - pr}" y1="${ty}" y2="${ty}"/><text class="ax" x="${W - pr}" y="${ty - 5}" text-anchor="end">${esc(opt.refLabel || "Target " + fmt(target))}</text>`;
  [0, 7, 13].forEach((i) => { const m = meta[i]; s += `<text class="ax" x="${m.x}" y="${H - 6}" text-anchor="middle">${i === 13 ? "Today" : shortDate(m.d)}</text>`; });
  s += `<line class="xh" x1="0" x2="0" y1="${pt}" y2="${pt + ih}" visibility="hidden"/><rect x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent" class="hit"/></svg>`;
  CHARTS[id] = { type: "bar", pts: meta, W, unit: opt.unit, fmtV: opt.fmtV, empty: opt.empty };
  return `<div class="chart" id="${id}">${s}<div class="tip" hidden></div></div>`;
}
function bindCharts(root) {
  $$(".chart", root).forEach((el) => {
    const c = CHARTS[el.id]; if (!c) return;
    const svg = $("svg", el), tip = $(".tip", el), xh = $(".xh", el);
    const show = (ev) => {
      const r = svg.getBoundingClientRect();
      const sx = ((ev.clientX - r.left) / r.width) * c.W;
      let best = c.pts[0], bd = Infinity;
      for (const p of c.pts) { const d = Math.abs(p.x - sx); if (d < bd) { bd = d; best = p; } }
      xh.setAttribute("x1", best.x); xh.setAttribute("x2", best.x); xh.setAttribute("visibility", "visible");
      const val = c.type === "bar" ? (best.n ? (c.fmtV ? c.fmtV(best.v) : `${fmt(best.v)} ${c.unit}`) : (c.empty || "Not logged")) : `${fmt1(best.v)} ${c.unit}`;
      tip.innerHTML = `<b></b><span></span>`;
      tip.firstChild.textContent = val; tip.lastChild.textContent = dateLabel(best.d);
      tip.hidden = false;
      const px = (best.x / c.W) * r.width;
      tip.style.left = clamp(px, 60, r.width - 60) + "px";
      tip.style.top = "-8px";
    };
    const hide = () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); };
    svg.addEventListener("pointermove", show);
    svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", hide);
  });
}

/* ================= bottom sheet ================= */
const Sheet = {
  stack: [],
  ctl: null,
  open(scr) { this.abort(); this.stack.forEach((s) => s.cleanup && s.cleanup()); this.stack = [scr]; this.show(); },
  push(scr) { this.abort(); this.stack.push(scr); this.show(); },
  replace(scr) { this.abort(); const old = this.stack.pop(); old && old.cleanup && old.cleanup(); this.stack.push(scr); this.show(); },
  back() { this.abort(); if (this.stack.length > 1) { const s = this.stack.pop(); s.cleanup && s.cleanup(); this.show(); } else this.close(); },
  close() {
    this.abort();
    this.stack.forEach((s) => s.cleanup && s.cleanup());
    this.stack = [];
    $("#sheet").hidden = true; $("#scrim").hidden = true;
    document.documentElement.style.overflow = "";
  },
  top() { return this.stack[this.stack.length - 1] || null; },
  isOpen() { return this.stack.length > 0; },
  abort() { if (this.ctl) { try { this.ctl.abort(); } catch { /* ignore */ } this.ctl = null; } },
  show(keepScroll) {
    const s = this.top(); if (!s) return;
    const body = $("#sheet-body");
    const st = keepScroll ? body.scrollTop : 0;
    $("#sheet-title").textContent = typeof s.title === "function" ? s.title() : s.title;
    body.innerHTML = s.render();
    $("#sheet-back").hidden = this.stack.length < 2;
    $("#sheet").hidden = false; $("#scrim").hidden = false;
    document.documentElement.style.overflow = "hidden";
    body.scrollTop = st;
    if (s.after) s.after(body);
  },
  refresh() { if (this.top()) this.show(true); },
};

async function loadImg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await (img.decode ? img.decode() : new Promise((r, j) => { img.onload = r; img.onerror = j; }));
    return { img, url };
  } catch (e) { URL.revokeObjectURL(url); throw e; }
}
function drawTo(img, max) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function thumbFrom(img, size = 88) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const m = Math.min(w, h);
  const c = document.createElement("canvas"); c.width = c.height = size;
  c.getContext("2d").drawImage(img, (w - m) / 2, (h - m) / 2, m, m, 0, 0, size, size);
  return c.toDataURL("image/jpeg", 0.6);
}
const canvasBlob = (c, q = 0.85) => new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("encode"))), "image/jpeg", q));
async function prepImage(file) {
  const { img, url: srcUrl } = await loadImg(file);
  try {
    const canvas = drawTo(img, 1568);
    const blob = await canvasBlob(canvas);
    return { blob, canvas, thumb: thumbFrom(img), url: URL.createObjectURL(blob) };
  } finally { URL.revokeObjectURL(srcUrl); }
}

function recentFoods(pid) {
  const seen = new Set(S.favorites.map((f) => f.name.toLowerCase()));
  const out = [];
  for (let i = 0; i < 21 && out.length < 8; i++) {
    const d = addDays(todayStr(), -i);
    const es = (dayDoc(pid, d).entries || []).slice().sort((a, b) => (b.t || 0) - (a.t || 0));
    for (const e of es) { const k = String(e.name || "").toLowerCase(); if (!k || seen.has(k)) continue; seen.add(k); out.push(e); if (out.length >= 8) break; }
  }
  return out;
}

/* ---------- barcode ---------- */
let zxingPromise = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (!zxingPromise) zxingPromise = (async () => { for (const u of ZXING_URLS) { try { await loadScript(u); if (window.ZXing) return window.ZXing; } catch { /* next */ } } return null; })();
  return zxingPromise;
}
function rotated(c) {
  const r = document.createElement("canvas"); r.width = c.height; r.height = c.width;
  const g = r.getContext("2d"); g.translate(r.width / 2, r.height / 2); g.rotate(Math.PI / 2); g.drawImage(c, -c.width / 2, -c.height / 2);
  return r;
}
function scaled(c, max) {
  const s = Math.min(1, max / Math.max(c.width, c.height)); if (s >= 1) return c;
  const r = document.createElement("canvas"); r.width = Math.round(c.width * s); r.height = Math.round(c.height * s);
  r.getContext("2d").drawImage(c, 0, 0, r.width, r.height); return r;
}
async function decodeBarcode(canvas) {
  let Z = null;
  try { Z = await loadZXing(); } catch { Z = null; }
  if (!Z || !Z.MultiFormatReader) return null;
  try {
    const hints = new Map();
    const F = Z.BarcodeFormat;
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128].filter((x) => x !== undefined));
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.MultiFormatReader();
    reader.setHints(hints);
    const tries = [() => scaled(canvas, 1200), () => canvas, () => rotated(scaled(canvas, 1200)), () => scaled(canvas, 700)];
    for (const mk of tries) {
      try {
        const c = mk();
        const src = new Z.HTMLCanvasElementLuminanceSource(c);
        const res = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src)));
        const txt = res && (res.getText ? res.getText() : res.text);
        if (txt) return txt;
      } catch { /* not found in this try */ }
      try { reader.reset(); } catch { /* ignore */ }
      await new Promise((r) => setTimeout(r, 0));
    }
  } catch (e) { console.warn("zxing", e); }
  return null;
}

function sleepFromInputs(date, bedStr, wakeStr) {

  const b = toMin(bedStr), w = toMin(wakeStr);

  const wake = parseYmd(date); wake.setHours(Math.floor(w / 60), w % 60, 0, 0);

/* ---------- talking to Claude ---------- */
async function coachSend(text) {
  const C = S.chat, p = P(S.me);
  if (!p || !S.ai || C.busy || !C.loaded) return;
  text = String(text || "").trim().slice(0, 2000);
  const att = C.attach;
  if (!text && !att) return;
  C.attach = null; C.confirmNew = false;
  C.msgs.push({ id: uid(), role: "user", text, t: Date.now(), ...(att ? { img: att.thumb } : {}) });
  const am = { id: uid(), role: "assistant", text: "", t: Date.now(), pending: true };
  C.msgs.push(am);
  C.busy = true; C.stream = ""; C.status = "";
  const ctl = new AbortController(); C.ctl = ctl;
  C.ver++; coachRender(); coachScroll(true);
  const opts = { signal: ctl.signal, cache: false, onText: ({ text: t }) => { if (C.ctl !== ctl) return; C.stream = t; C.status = ""; coachStream(); } };
  if (att) opts.images = [att.blob];
  if (S.aiTools) opts.tools = coachTools(p);
  try {
    const res = await S.ai(chatTurns(p), opts);
    const out = splitActions(res.text);
    am.text = out.visible.slice(0, 3000);
    am.actions = out.actions.slice(0, 8).map(makeCard);
    if (out.parseErr) am.actionsErr = true;
    if (res.truncated) am.cut = true;
  } catch (e) {
    const code = e && e.code;
    const part = e && e.text && code !== "refused" ? splitActions(e.text).visible.slice(0, 3000) : "";
    am.text = code === "cancelled" ? splitActions(C.stream).visible.slice(0, 3000) || part : part;
    if (code === "cancelled") am.stopped = true;
    else { am.err = aiErr(e); if (code === "tools_unavailable") S.aiTools = false; }
  } finally {
    if (att && att.url) URL.revokeObjectURL(att.url);
    if (C.ctl === ctl) { delete am.pending; C.busy = false; C.ctl = null; C.stream = ""; C.status = ""; C.ver++; if (S.chat.key === p.id) saveChat(); }
    const near = nearBottom();
    coachRender();
    if (near) coachScroll();
  }
}
function coachApply(mid, k, quiet) {
  if (guardWrite()) return false;
  const m = S.chat.msgs.find((x) => x.id === mid);
  const a = m && (m.actions || []).find((x) => x.k === k);
  if (!a || a.status !== "pending") return false;
  let plan;
  try { plan = planAction(a.raw); } catch (e) { console.warn(e); plan = { ok: false, note: "Something went wrong with this change." }; }
  if (!plan.ok) { a.status = "invalid"; a.note = plan.note; S.chat.ver++; coachRender(); saveChat(); if (!quiet) toast(plan.note); return false; }
  S.chat.undo[k] = plan.writes.map(([path]) => [path, getLocalDoc(path)]);
  for (const [path, doc] of plan.writes) writeDoc(path, doc);
  Object.assign(a, { status: "applied", title: plan.title, lines: plan.lines, note: plan.note || "", at: Date.now() });
  S.chat.ver++;
  render();
  saveChat();
  if (!quiet) toast(plan.toast || "Done");
  return true;
}
function coachUndo(mid, k) {
  if (guardWrite()) return;
  const m = S.chat.msgs.find((x) => x.id === mid);
  const a = m && (m.actions || []).find((x) => x.k === k);
  const u = S.chat.undo[k];
  if (!a || !u) return;
  for (const [path, doc] of u) writeDoc(path, doc);
  delete S.chat.undo[k];
  a.status = "undone"; S.chat.ver++;

  "cm-send"() {

/* ================= AI: coach & ideas ================= */
function coachPrompt(p) {
  const t = targetsFor(p), c = coachFor(p);
  const rows = checkinsFor(p.id).slice(-8).map((x) => `${x.date}: weight ${num(x.weight) ?? "?"} kg, skeletal muscle ${num(x.smm) ?? "?"} kg, body fat ${bfmOf(x) !== null ? fmt1(bfmOf(x)) : "?"} kg (${pbfOf(x) !== null ? fmt1(pbfOf(x)) : "?"}%), visceral fat level ${num(x.visceral) ?? "?"}, BMR ${num(x.bmr) ?? "?"}`).join("\n");
  const weeks = [];
  for (let w = 3; w >= 0; w--) {
    const to = addDays(todayStr(), -7 * w + 1), from = addDays(to, -7);
    const it = intakeBetween(p.id, from, to);
    weeks.push(`${from} to ${addDays(to, -1)}: ${it.logged} of 7 days logged${it.avgK !== null ? `, average ${fmt(it.avgK)} kcal and ${fmt(it.avgP)} g protein on logged days` : ""}`);
  }
  const sleepLines = [];
  for (let w = 3; w >= 0; w--) {
    const to = addDays(todayStr(), -7 * w + 1), from = addDays(to, -7);
    const sl = sleepStats(p.id, from, to);
    sleepLines.push(`${from} to ${addDays(to, -1)}: ${sl.n ? `${hm(sl.avg)} average sleep over ${sl.n} nights, usual bedtime ${sl.bed}` : "sleep not logged"}`);
  }
  return `You are a careful, encouraging sports-nutrition coach inside a calorie-tracking app. ${AI_CONTEXT}
Person: ${p.name}, ${p.sex === "female" ? "female" : "male"}, ${ageOf(p)} years old${num(p.height) ? `, ${fmt(p.height)} cm` : ""}. Goal: lose body fat while building or keeping muscle (recomposition). Activity: ${t.act.l} (${t.act.d}). Chosen pace: ${t.pace.l}.
Current daily targets: ${t.kcal} kcal, ${t.protein} g protein, ${t.carbs} g carbs, ${t.fat} g fat. Estimated maintenance ${t.tdee} kcal; BMR ${t.bmr} kcal.
InBody check-ins, oldest first:
${rows}
Food log by week:
${weeks.join("\n")}
Sleep by week (from the app's sleep tracker):
${sleepLines.join("\n")}
The app's own rule-based read of the last two check-ins: "${c.title || "baseline only"}". ${c.why || ""}
Write next week's plan. Rules: aim for fat loss of about 0.5–1% of body weight per week while skeletal muscle holds or rises; protein 1.6–2.4 g per kg of body weight; never go below the BMR; change calories by at most 200 kcal from the current target; if fewer than 5 days a week were logged, say that the data is thin and keep calories about the same. Note that InBody readings shift with water, food and time of day. Use plain, friendly sentences and no medical claims.
Reply with only JSON:
{"headline":"Fat down, muscle holding: keep going","assessment":"2–3 sentences on what changed and why","kcal":1650,"protein":120,"carbs":160,"fat":50,"tips":["3 short, specific actions for this week"],"watch":"one thing to look at in the next InBody"}`;
}
async function runCoachAI(p) {
  if (!p || !S.ai) return;
  if (S.coachCtl) S.coachCtl.abort();
  const ctl = new AbortController(); S.coachCtl = ctl;
  S.coachAI = { pid: p.id, loading: true }; render();
  try {
    const res = await S.ai.json(coachPrompt(p), { signal: ctl.signal, cache: false });
    const a = {
      pid: p.id, date: todayStr(), t: Date.now(),
      headline: String(res.headline || "This week's plan").slice(0, 120),
      assessment: String(res.assessment || "").slice(0, 900),
      kcal: r0(nz(res.kcal)) || null, protein: r0(nz(res.protein)), carbs: r0(nz(res.carbs)), fat: r0(nz(res.fat)),
      tips: Array.isArray(res.tips) ? res.tips.slice(0, 5).map((x) => String(x).slice(0, 300)) : [],
      watch: String(res.watch || "").slice(0, 300),
    };
    S.advice[p.id] = a; S.coachAI = null; render();
    if (!S.readOnly) Store.set("advice/" + p.id, a);
  } catch (e) {
    S.coachAI = e && e.code === "cancelled" ? null : { pid: p.id, error: aiErr(e) };
    render();
  } finally { if (S.coachCtl === ctl) S.coachCtl = null; }
}
async function runIdeas(p) {
  if (!p || !S.ai) return;
  const key = p.id + "_" + S.date;
  const t = targetsFor(p), tot = dayTotals(p.id, S.date);
  const prevSt = S.ideas[key];
  const avoid = prevSt && prevSt.items ? prevSt.items.map((x) => x.title).join("; ") : "";
  if (S.ideasCtl) S.ideasCtl.abort();
  const ctl = new AbortController(); S.ideasCtl = ctl;
  S.ideas[key] = { loading: true }; render();
  try {
    const res = await S.ai.json(ideasPrompt(p, t.kcal - tot.kcal, t.protein - tot.p, avoid), { signal: ctl.signal, modelTier: "quick", cache: avoid ? false : true });
    const items = (Array.isArray(res) ? res : Array.isArray(res && res.items) ? res.items : []).slice(0, 3).map((x) => ({
      title: String(x.title || "Idea").slice(0, 90), detail: String(x.detail || "").slice(0, 120),
      kcal: r0(nz(x.kcal)), protein: r0(nz(x.protein)), carbs: r0(nz(x.carbs)), fat: r0(nz(x.fat)),
    }));
    S.ideas[key] = items.length ? { items } : { error: "No ideas came back. Try again." };
  } catch (e) {
    S.ideas[key] = e && e.code === "cancelled" ? (prevSt && prevSt.items ? prevSt : undefined) : { error: aiErr(e) };
  } finally { if (S.ideasCtl === ctl) S.ideasCtl = null; }
  render();
}

/* ================= data subscriptions ================= */
let unsubDays = null, unsubSleep = null;
function watchDays() {
  if (unsubSleep) unsubSleep();
  unsubSleep = Store.watch("sleep", [["date", ">=", S.daysFrom]], (docs, meta) => {
    const next = {};
    for (const d of docs) if (d.pid && d.date && num(d.bed) && num(d.wake)) next[d.id] = d;
    S.sleep = next;
    if (!S.sleepReady && !(meta && meta.fromCache)) { S.sleepReady = true; detectSleep(); }
    render();
  }, dbFailed);
  if (unsubDays) unsubDays();
  unsubDays = Store.watch("days", [["date", ">=", S.daysFrom]], (docs) => {
    const next = {};
    for (const d of docs) if (d.pid && d.date) next[d.id] = { pid: d.pid, date: d.date, entries: Array.isArray(d.entries) ? d.entries : [] };
    S.days = next; render();
  }, dbFailed);
}
function dbFailed(e) {
  if (e && (e.code === "revoked" || e.code === "not_granted")) { S.readOnly = true; render(); }
}
function resolveMe() {
  if (S.me && !P(S.me)) S.me = null;
  if (!S.me && S.uid) { const mine = S.people.find((p) => p.uid === S.uid); if (mine && S.people.filter((p) => p.uid === S.uid).length === 1) { S.me = mine.id; ls.set("tp.me", mine.id); } }
  if (!S.view || !P(S.view)) {
    const lv = ls.get("tp.view", null);
    S.view = (lv && P(lv) ? lv : null) || S.me || null;
  }
}
let onboardShown = false;
function subscribe() {
  Store.watch("people", [], (docs) => {
    S.people = docs.filter((p) => p.name).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    S.peopleReady = true;
    resolveMe();
    detectSleep();
    render();
    if (!S.me && !onboardShown && !Sheet.isOpen() && !S.readOnly) { onboardShown = true; Sheet.open(S.people.length ? scrOnboard() : scrProfile(null, { claim: true })); }
  }, dbFailed);
  Store.watch("checkins", [], (docs) => { S.checkins = docs; render(); }, dbFailed);
  Store.watch("products", [], (docs) => { S.products = Object.fromEntries(docs.filter((d) => d.name).map((d) => [d.id, { ...d, code: d.code || d.id }])); render(); }, dbFailed);
  Store.watch("favs", [], (docs) => { S.favorites = docs.filter((d) => d.name).sort((a, b) => (b.t || 0) - (a.t || 0)); }, dbFailed);
  Store.watch("presence", [], (docs, meta) => {
    const next = Object.fromEntries(docs.map((d) => [d.id, d]));
    if (S.me && S.presence[S.me] && S.presence[S.me]._local && (!next[S.me] || (next[S.me].t || 0) < S.presence[S.me].t)) next[S.me] = S.presence[S.me];
    S.presence = next;
    if (!S.presenceReady && !(meta && meta.fromCache)) { S.presence0 = { ...next }; S.presenceReady = true; detectSleep(); }
    render();
  }, dbFailed);
  Store.watch("advice", [], (docs) => { S.advice = Object.fromEntries(docs.map((d) => [d.id, d])); render(); }, dbFailed);
  watchDays();
}

    [".coach-intro > div", [[/^Ask me anything about food, fat loss, muscle or sleep\. I can see your targets, food log, InBody check-ins and sleep\. I can also log food or change your targets and goals\. Nothing changes until you tap <b>Apply<\/b>\.$/,

      [/^<b>New product \((.+?)\)\.<\/b> Add its nutrition label once\. Next time, scanning logs it instantly\.$/, "<b>新商品（$1）。</b>先加一次營養標示，下次掃描就能立刻記錄。"],
      [/^(.+?) is set up: sleep arrives (from Mi Fitness \/ Apple Health|from phone use)\.$/, (_, p, w) => `${p} 已設定好：睡眠資料${w.startsWith("from Mi") ? "來自 Mi Fitness／Apple 健康" : "根據手機使用推估"}。`],

    ["ol.steps", "Send sleep to Apple Health.", `<li><b>把睡眠傳到 Apple 健康。</b>在 Mi Fitness 打開<b>我的</b> → <b>第三方資料</b> → <b>Apple 健康</b>，開啟並允許<b>睡眠</b>。隔天早上，確認「健康」→「瀏覽」→「睡眠」有你昨晚的睡眠。</li><li>打開<b>捷徑</b>，點 <b>+</b>，再點上方的名稱 → <b>重新命名</b> → <b>Two Plates</b>。</li><li>搜尋<b>尋找健康樣本</b>並加入。點<b>類型</b> → <b>睡眠分析</b>。第一個篩選條件設為<b>開始日期</b> · <b>在過去 2 天內</b>。點<b>加入篩選條件</b> → <b>結束日期</b> → <b>是今天</b>。不要加「來源」篩選，名稱常常對不上。排序選<b>開始日期</b>，順序選<b>最舊的優先</b>。</li><li>加入<b>從列表取得項目</b> → <b>第一個項目</b>。點藍色的輸入欄，選健康樣本的<b>開始日期</b>，讓它變成<b>從開始日期取得第一個項目</b>。加入<b>格式化日期</b> → 日期格式選<b>自訂</b>，格式字串 <code>yyyyMMddHHmm</code>。加入<b>設定變數</b>，命名為 <code>Bed</code>。</li><li>加入<b>從列表取得項目</b> → <b>最後一個項目</b>。點藍色的輸入欄 → <b>選擇變數</b> → 點第一個動作的<b>健康樣本</b>，再點一次這個字，選<b>結束日期</b>，讓它變成<b>從結束日期取得最後一個項目</b>。加入<b>格式化日期</b> → 自訂，<code>yyyyMMddHHmm</code>。加入<b>設定變數</b>，命名為 <code>Wake</code>。</li><li>加入 <b>URL</b>。貼上你的連結，輸入 <code>#sleep-</code>，插入 <b>Bed</b> 變數，輸入 <code>-</code>，再插入 <b>Wake</b>。</li><li>加入<b>打開 URL</b>。點 <b>▶</b> 測試並允許取用健康資料，然後點名稱 → <b>加入主畫面</b>。</li>`],
    ["p.muted", "Open Mi Fitness first in the morning so it syncs", `早上先打開 Mi Fitness 讓它同步，再從新圖示打開 Two Plates。沒時間設定？在睡眠編輯畫面用<b>從截圖讀取</b>也可以。`],
    ["ol.steps", "In Shortcuts, go to Automation → + → App.", `<li>在<b>捷徑</b>點<b>自動化</b> → <b>+</b> → <b>App</b>。</li><li>點<b>選擇</b>，挑最常用的 App，例如 LINE、Instagram、Safari、YouTube、訊息和 TikTok，挑越多越準。勾選<b>已打開</b>和<b>已關閉</b>。</li><li>選<b>立即執行</b>，關閉<b>執行時通知</b>。點<b>下一步</b> → <b>新增空白自動化操作</b>。</li><li>加入<b>格式化日期</b>：日期選<b>目前日期</b>，日期格式選<b>自訂</b>，格式字串 <code>MMddHHmm</code>。</li><li>加入<b>文字</b>：插入<b>格式化的日期</b>，後面直接打一個點 <code>.</code>。</li><li>加入<b>附加到文字檔案</b>：把<b>文字</b>附加到檔案路徑 <code>twoplates-log.txt</code>，關閉<b>建立新行</b>。</li>`],

  const SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "INPUT", "CODE", "SELECT", "OPTION"]);
  const ATTRS = ["placeholder", "aria-label", "title", "alt"];
  const skipEl = (el) => !el || SKIP.has(el.nodeName) || (el.closest && el.closest(".bub, code, .tp-keep"));
  function applyRules(root) {
    if (!ZH || root.nodeType !== 1) return;
    for (const [sel, rules] of HTML_RULES) {
      const els = root.matches && root.matches(sel) ? [root, ...root.querySelectorAll(sel)] : root.querySelectorAll(sel);
      for (const el of els) {
        const html = el.innerHTML.trim();
        for (const [re, rep] of rules) { if (re.test(html)) { el.innerHTML = html.replace(re, rep); break; } }
      }
    }
    for (const [sel, start, html] of BLOCKS) {
      const els = root.matches && root.matches(sel) ? [root, ...root.querySelectorAll(sel)] : root.querySelectorAll(sel);
      for (const el of els) if (el.textContent.trim().startsWith(start)) el.innerHTML = html;
    }
  }
  function textNode(n) {
    const p = n.parentNode;
    if (!p || skipEl(p)) return;
    const v = n.nodeValue;
    let out;
    if (ZH && p.namespaceURI === "http://www.w3.org/2000/svg") out = svgDate(v) || tr(v);
    else out = tr(v);
    if (out !== v) n.nodeValue = out;
  }
  function attrs(el) {
    if (skipEl(el) && !(el.nodeName === "INPUT" || el.nodeName === "TEXTAREA")) return;
    if (el.closest && el.closest(".bub")) return;
    for (const a of ATTRS) { const v = el.getAttribute(a); if (v) { const o = tr(v); if (o !== v) el.setAttribute(a, o); } }
    if (ZH && el.classList.contains("sug") && el.dataset.q) { const o = tr(el.dataset.q); if (o !== el.dataset.q) el.dataset.q = o; }
  }
  function walk(root) {
    if (root.nodeType === 3) { textNode(root); return; }
    if (root.nodeType !== 1 || skipEl(root) && !(root.nodeName === "INPUT" || root.nodeName === "TEXTAREA")) { if (root.nodeType === 1) attrs(root); return; }
    applyRules(root);
    attrs(root);
    const it = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    let n;
    while ((n = it.nextNode())) { if (n.nodeType === 3) textNode(n); else attrs(n); }
  }
  function profileLang() {
    const v = document.getElementById("view-profile");
    if (!v || v.hidden || !v.firstElementChild || v.querySelector(".tp-lang")) return;
    v.insertAdjacentHTML("beforeend", `<section class="card tp-lang tp-keep" style="display:flex;flex-direction:column;gap:10px"><div class="chart-head" style="margin:0"><h3>語言 · Language</h3></div>${langSeg()}</section>`);
  }
  let busy = false;
  const mo = new MutationObserver((list) => {
    if (busy) return;
    busy = true;
    try {
      for (const m of list) {
        if (m.type === "childList") m.addedNodes.forEach(walk);
        else if (m.type === "characterData") textNode(m.target);
        else if (m.type === "attributes") attrs(m.target);
      }
      profileLang();
    } finally { busy = false; mo.takeRecords(); }
  });
  walk(document.body);
  profileLang();
  mo.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });
  if (ZH) document.title = "Two Plates（展示版）";
})();

<script>
/* Two Plates public demo: "Demo" badge in the header and a welcome card on the first visit (Chinese or English). */

  const T = ZH ? {
    lead: "我為自己和想好好照顧健康的朋友們做的熱量、InBody 和睡眠追蹤 App。我每天都用 iPhone 記錄。",
